# Blueprint do Render: cria as duas APIs a partir do Dockerfile de cada repositório.
# Aplicar em: Render → New → Blueprint → este repositório.
# Referência: https://render.com/docs/blueprint-spec
#
# Plano free: o serviço dorme após 15 min sem acesso (acorda em ~1 min) e o disco é
# temporário, então o banco SQLite começa vazio a cada deploy, reinício ou soneca.

projects:
  - name: Task API
    environments:
      - name: Production
        services:
          - type: web
            name: task-api-express
            runtime: docker
            repo: https://github.com/EduardoLovo/Task-api-express
            branch: main
            plan: free
            # Não há região na América do Sul; a costa leste dos EUA é a mais próxima.
            region: virginia
            healthCheckPath: /health
            # Só faz o deploy depois que o CI do commit passar.
            autoDeployTrigger: checksPass
            envVars:
              # Mesma porta do Dockerfile (e do HEALTHCHECK dele).
              - key: PORT
                value: "3000"
              # Segredo próprio desta API: cada uma tem o seu banco de usuários.
              - key: JWT_SECRET
                generateValue: true
              # Saltos até a API no Render: Cloudflare → proxies internos (10.x).
              # Medido pelo log de acesso em 2026-10-08: com 1, a API via IPs 10.x;
              # com 3, o IP real do cliente, e um X-Forwarded-For forjado é ignorado.
              - key: TRUST_PROXY
                value: "3"
              # Front na Vercel: domínio de produção + URLs de preview (uma por deploy e por branch,
              # todas terminando com o nome da conta). O * casa só letras, números e hífens, nunca
              # um ponto, então não aceita domínios de outras contas.
              - key: CORS_ORIGIN
                value: "https://task-app-angular-taupe.vercel.app,https://task-app-angular-*-eduardolovos-projects.vercel.app"

          - type: web
            name: task-api-flask
            runtime: docker
            repo: https://github.com/EduardoLovo/task-api-flask
            branch: main
            plan: free
            region: virginia
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            envVars:
              - key: PORT
                value: "5000"
              - key: JWT_SECRET
                generateValue: true
              - key: TRUST_PROXY
                value: "3"
              # Mesmo valor do Express.
              - key: CORS_ORIGIN
                value: "https://task-app-angular-taupe.vercel.app,https://task-app-angular-*-eduardolovos-projects.vercel.app"
